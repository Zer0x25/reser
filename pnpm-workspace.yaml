packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@axe-core/playwright": ^4.14.0
  "@playwright/test": ^1.64.1
  "@types/node": ^24
  "@vitest/coverage-v8": 5.0.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
